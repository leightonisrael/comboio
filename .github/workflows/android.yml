name: Android (APK)

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Sem os segredos o build continua, assinado com a chave de depuração:
      # instala, mas não atualiza por cima de um APK assinado com outra chave.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Segredos de assinatura ausentes. APK assinado com chave de depuração."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/comboio-release.jks
          {
            echo "storeFile=comboio-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Nomear o APK
        run: cp build/app/outputs/flutter-apk/app-release.apk comboio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: comboio-android
          path: comboio.apk
          if-no-files-found: error
          retention-days: 30
