name: comboio
description: Intercomunicador por voz para motociclistas, sem internet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_tts: ^4.2.5
  flutter_webrtc: ^1.7.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: SairaCondensed
      fonts:
        - asset: assets/fonts/SairaCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SairaCondensed-Bold.ttf
          weight: 700
